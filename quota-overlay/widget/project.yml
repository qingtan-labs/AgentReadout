name: GaugeForCodexWidget
options:
  minimumXcodeGenVersion: 2.40.0
  createIntermediateGroups: true
targets:
  GaugeForCodexWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: GaugeWidget.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingtanlabs.gaugeforcodex.widget
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: Widget.entitlements
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 2.0.1
        CURRENT_PROJECT_VERSION: 33
        SKIP_INSTALL: YES
    scheme: {}
