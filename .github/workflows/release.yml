name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release artifacts
        run: ./package-release.sh "${GITHUB_REF_NAME#v}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="docs/release-notes/${VERSION}.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            NOTES_FILE="docs/release-notes/1.0.0.md"
          fi
          gh release create "$GITHUB_REF_NAME" \
            release/Gauge-for-Codex-*-Universal.dmg \
            release/Gauge-for-Codex-*-Universal.zip \
            release/SHA256SUMS \
            --title "Gauge for Codex ${VERSION}" \
            --notes-file "$NOTES_FILE"
