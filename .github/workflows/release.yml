name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build release artifacts
        run: ./package-release.sh "${GITHUB_REF_NAME#v}"
      - name: Verify widget and updater regressions
        run: zsh ./quota-overlay/test-regressions.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="docs/release-notes/${VERSION}.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            NOTES_FILE="docs/release-notes/1.0.0.md"
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              release/AgentReadout-*-Universal.dmg \
              release/AgentReadout-*-Universal.zip \
              release/SHA256SUMS release/update.json --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "AgentReadout ${VERSION}" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" \
              release/AgentReadout-*-Universal.dmg \
              release/AgentReadout-*-Universal.zip \
              release/SHA256SUMS release/update.json \
              --title "AgentReadout ${VERSION}" \
              --notes-file "$NOTES_FILE"
          fi
