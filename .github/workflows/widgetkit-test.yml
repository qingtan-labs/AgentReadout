name: Native widget test

on:
  push:
    branches:
      - feature/native-widgetkit

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build app and WidgetKit extension
        run: ./quota-overlay/build.sh
      - name: Verify embedded extension
        run: |
          test -x "quota-overlay/build/Gauge for Codex.app/Contents/PlugIns/GaugeForCodexWidget.appex/Contents/MacOS/GaugeForCodexWidget"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' 'quota-overlay/build/Gauge for Codex.app/Contents/PlugIns/GaugeForCodexWidget.appex/Contents/Info.plist')" = 'com.apple.widgetkit-extension'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' 'quota-overlay/build/Gauge for Codex.app/Contents/PlugIns/GaugeForCodexWidget.appex/Contents/Info.plist')" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' quota-overlay/Info.plist)"
          codesign --verify --deep --strict "quota-overlay/build/Gauge for Codex.app"
      - name: Verify release packaging
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' quota-overlay/Info.plist)"
          ./package-release.sh "$VERSION"
          (cd release && shasum -a 256 -c SHA256SUMS)
          unzip -p "release/AgentReadout-${VERSION}-Universal.zip" 'AgentReadout.app/Contents/PlugIns/GaugeForCodexWidget.appex/Contents/Info.plist' | plutil -lint -
      - name: Archive test app
        run: ditto -c -k --sequesterRsrc --keepParent "quota-overlay/build/Gauge for Codex.app" widget-test.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gauge-widget-test
          path: widget-test.zip
